name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  changes:
    # Decides whether lint, test and package run. The docs filter lives here,
    # not in a workflow-level paths-ignore: a skipped workflow never reports
    # `CI passed`, so a docs-only pull request would wait on it forever.
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both sides of a rename count, so moving code into docs/ still runs.
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -qv '^docs/' <<<"$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint (ruff, ty)
    needs: changes
    # Anything but an explicit `false` runs it, so a failed `changes` job
    # still runs the checks instead of skipping them.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q

  package:
    # Build the sdist and wheel, then install each into a fresh environment
    # and run the installed command: catches packaging mistakes (a module
    # left out of the wheel, a dependency missing from the metadata) that
    # the tests, which run from the source tree, can't see.
    name: package
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Smoke-test the wheel and the sdist
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Code/demo/.git"
          export CORRAL_CONFIG="$RUNNER_TEMP/none.toml"
          for dist in dist/*.whl dist/*.tar.gz; do
            env="$RUNNER_TEMP/venv-$(basename "$dist")"
            uv venv -q "$env"
            uv pip install -q --python "$env" "$dist"
            "$env/bin/corral" --version
            "$env/bin/corral" models > /dev/null
            "$env/bin/corral" ls --json --root "$RUNNER_TEMP/Code" | grep -q '"project": "demo"'
            "$env/bin/python" -c "import corral.tui.app, corral.tui.settings"
          done

  ok:
    # The one check branch protection requires, so the matrix can change
    # without editing the protection rule. On a docs-only pull request the
    # checks are skipped, and only then does a skip count as passing.
    name: CI passed
    if: always()
    needs: [changes, lint, test, package]
    runs-on: ubuntu-latest
    steps:
      - env:
          CODE: ${{ needs.changes.outputs.code }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          want=success
          if [ "$CODE" = false ]; then want=skipped; fi
          test "$LINT" = "$want"
          test "$TEST" = "$want"
          test "$PACKAGE" = "$want"

  commits:
    name: conventional commit titles
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
