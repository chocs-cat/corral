[project]
name = "corral-herdr"
version = "0.7.0"
description = "Round up your projects into herdr workspaces: a utility tab plus model/effort agent tabs, from a CLI or a TUI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Foland", email = "john@johnfoland.net" }]
requires-python = ">=3.11"
dependencies = [
    "textual>=8,<9",
    "tomlkit>=0.13",
]
keywords = ["herdr", "terminal", "workspace", "tui", "claude", "codex", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/chocs-cat/corral"
Changelog = "https://github.com/chocs-cat/corral/blob/master/CHANGELOG.md"
Issues = "https://github.com/chocs-cat/corral/issues"

[project.scripts]
corral = "corral.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corral"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "skills", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "ty==0.0.84",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "C4", "PERF", "PTH"]
# Textual's BINDINGS / CSS class attributes are lists by convention.
ignore = ["RUF012"]
